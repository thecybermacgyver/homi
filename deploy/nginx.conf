server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/homi-security-headers.conf;

  location /api/ {
    proxy_pass http://core:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://core:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service-worker scripts must never be held by an edge/browser cache.
  # The query-versioned registration also guarantees an existing PWA asks
  # for the new worker URL after every deliberate worker generation bump.
  location = /sw.js {
    include /etc/nginx/homi-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/homi-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/homi-security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Runtime bridge filenames are intentionally stable/unhashed. no-store is
  # required because the public edge otherwise assigns them a browser TTL.
  location /module-runtime/ {
    include /etc/nginx/homi-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Vite/Rolldown build assets are content hashed and safe to cache forever.
  location /assets/ {
    include /etc/nginx/homi-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Homi is an SPA. Keep all unhashed shell/static paths revalidated while
  # the service worker separately retains the verified offline shell.
  location / {
    include /etc/nginx/homi-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /index.html;
  }
}
